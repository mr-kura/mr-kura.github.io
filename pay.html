<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Secure payment — Mr. Kura</title><link rel="stylesheet" href="/styles.css"><style>.pay-wrap{max-width:650px;padding-top:64px;padding-bottom:80px}.pay-card{border:1px solid var(--line);border-radius:18px;padding:clamp(20px,5vw,36px);background:#fff}.pay-amount{font-size:clamp(30px,7vw,46px);font-weight:800;letter-spacing:-.04em;margin:14px 0}.pay-button{border:0;border-radius:28px;background:var(--blue);color:#fff;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:22px}.pay-button:disabled{opacity:.6;cursor:wait}.pay-note{font-size:13px;color:var(--muted)}#pay-status{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><header class="site-header"><a class="brand" href="/" aria-label="Mr. Kura home"><img src="/assets/mr-kura-logo.jpg" alt="Mr. Kura"></a><a class="nav-cta" href="/">Back to website</a></header><main class="wrap pay-wrap"><p class="eyebrow">SECURE CHECKOUT</p><h1>Payment request<span style="color:#3949ab">.</span></h1><div class="pay-card"><p id="pay-description">Loading payment details…</p><div class="pay-amount" id="pay-amount">—</div><p id="pay-customer" class="pay-note"></p><button id="pay-button" class="pay-button" disabled>Continue to secure checkout</button><p id="pay-status" class="pay-note" role="status"></p></div><p class="pay-note">Payments are processed by Flutterwave. This page never collects or stores your card details.</p></main><footer><p>© 2026 Mr. Kura.</p></footer><script src="/pay.js" defer></script></body></html>
